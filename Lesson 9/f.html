<!doctype html>
<html>
  <head>
    <title>Cat</title>
    <style>
      .cat {
        width: 200px;
        height: 200px;
        object-position: center;
        object-fit: cover;
        cursor: pointer;
      }

      .box {
        height: 320px;
        width: 200px;
        box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.25);
        margin: 20px;
        display: inline-block;
        margin-left: 5px;
      }

      .name {
        padding-left: 5px;
        font-family: Arial;
        font-size: 15px;
      }

      .friend {
        padding-left: 5px;
        font-family: Arial;
        font-size: 12px;
        color: rgb(161, 157, 157);
      }

      .add {
        background-color: rgb(0, 162, 255);
        color: white;
        font-family: Arial;
        font-size: 15px;
        border: none;
        border-radius: 5px;
        padding-left: 5px;
        padding-right: 5px;
        margin-left: 5px;
        padding-top: 5px;
        padding-bottom: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="cat" src="Cat.jpg" />
      <p class="name"><strong>Oliver</strong></p>
      <p class="friend">2 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>

    <div class="box">
      <img class="cat" src="OIP.webp" />
      <p class="name"><strong>Mimi</strong></p>
      <p class="friend">4 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>

    <div class="box">
      <img class="cat" src="th.webp" />
      <p class="name"><strong>Rex</strong></p>
      <p class="friend">3 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>
  </body>
</html>
