<style>
  .shadow-button {
    background-color: green;
    color: white;
    border: none;
    padding-top: 4px;
    padding-bottom: 4px;
    padding-left: 10px;
    padding-right: 10px;
    cursor: pointer;
    transition: box-shadow, 0.15s;
  }

  .shadow-button:hover {
    box-shadow: 2.5px 2.5px 5px rgba(0, 0, 0, 0.5);
  }

  .shadow-button:active {
    margin-top: 2px;
    margin-left: 2px;
    box-shadow: 0px 0px 0px rgba(0, 0, 0, 0);
  }
</style>

<button class="shadow-button">Shadow</button>
