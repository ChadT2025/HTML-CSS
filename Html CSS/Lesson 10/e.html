<!doctype html>
<html>
  <head>
    <title>Cat</title>
    <style>
      p {
        margin-top: 0;
        margin-bottom: 0;
      }
      .cat {
        width: 200px;
        height: 200px;
        object-position: center;
        object-fit: cover;
        cursor: pointer;
      }

      .box {
        height: 320px;
        width: 200px;
        box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.25);
        margin: 20px;
        display: inline-block;
        margin-left: 5px;
      }

      .name {
        padding-left: 5px;
        font-family: Arial;
        font-size: 15px;
        display: block;
        margin-bottom: 5px;
      }

      .friend {
        padding-left: 1px;
        font-family: Arial;
        font-size: 12px;
        color: rgb(161, 157, 157);
        display: inline-block;
        margin-bottom: 7px;
      }

      .add {
        background-color: rgb(0, 162, 255);
        color: white;
        font-family: Arial;
        font-size: 15px;
        border: none;
        border-radius: 5px;
        padding-left: 5px;
        padding-right: 5px;
        margin-left: 5px;
        padding-top: 5px;
        padding-bottom: 5px;
        cursor: pointer;
        display: block;
      }

      .pic {
        width: 25px;
        border-radius: 50px;
        margin-left: 6px;
        margin-bottom: 7px;
      }

      .profile {
        display: inline-block;
        width: 35px;
        vertical-align: top;
      }

      .row {
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="box">
        <div class="row"><img class="cat" src="Cat.jpg" /></div>
        <div>
          <p class="name"><strong>Oliver</strong></p>
          <div class="profile">
            <img class="pic" src="channel-2.jpeg" />
          </div>
          <p class="friend">2 mutual friends</p>
          <button class="add">Add Friend</button>
        </div>
      </div>

      <div class="box">
        <div class="row"><img class="cat" src="OIP.webp" /></div>
        <div>
          <p class="name"><strong>Mimi</strong></p>
          <div class="profile">
            <img class="pic" src="channel-2.jpeg" />
          </div>
          <p class="friend">4 mutual friends</p>
          <button class="add">Add Friend</button>
        </div>
      </div>

      <div class="box">
        <div class="row"><img class="cat" src="th.webp" /></div>
        <div>
          <p class="name"><strong>Rex</strong></p>
          <div class="profile">
            <img class="pic" src="channel-2.jpeg" />
          </div>
          <p class="friend">3 mutual friends</p>
          <button class="add">Add Friend</button>
        </div>
      </div>
    </div>
  </body>
</html>
