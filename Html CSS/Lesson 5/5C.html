<!doctype html>
<html>
  <head>
    <title>Website</title>
    <style>
      p {
        font-family: Verdana;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .p-heading {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 3px;
      }

      .p-sub {
        font-size: 15px;
        color: grey;
        margin-bottom: 20px;
      }

      .p-paragraph {
        font-size: 15px;
        width: 280px;
        margin-bottom: 20px;
      }

      .get-button {
        background-color: green;
        color: white;
        border: none;
        border-radius: 3px;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 16px;
        padding-right: 16px;
      }
    </style>
  </head>
  <body>
    <p class="p-heading">HTML CSS Course</p>

    <p class="p-sub">Beginner to Pro</p>

    <p class="p-paragraph">
      In this course, we'll learn the skills you need to become a developer.
    </p>

    <button class="get-button">Get Started</button>
  </body>
</html>
