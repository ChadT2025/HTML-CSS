<!doctype html>
<html>
  <head>
    <title>Cat</title>
    <style>
      .box {
        box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.25);
        width: 360px;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-right: 3px;
        padding-left: 6px;
        border-radius: 5px;
      }
      .cat {
        width: 50px;
        height: 50px;
        object-fit: cover;
        object-position: center;
        border-radius: 25px;
        vertical-align: middle;
      }
      .text {
        font-size: 18px;
        font-family: Arial;
        border: none;
        color: grey;
        vertical-align: middle;
      }

      .tweet {
        background-color: rgb(7, 167, 216);
        color: white;
        font-weight: bold;
        font-size: 15px;
        font-family: Arial;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        border: none;
        border-radius: 16px;
        vertical-align: middle;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="cat" src="Cat.jpg" />
      <input class="text" src="text" placeholder="What's happening?" />
      <button class="tweet">Tweet</button>
    </div>
  </body>
</html>
