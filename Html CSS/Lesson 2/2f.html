<style>
  .apply-button {
    background-color: rgb(10, 102, 194);
    color: white;
    border: none;
    padding-top: 8px;
    padding-bottom: 8px;
    padding-left: 18px;
    padding-right: 18px;
    border-radius: 15px;
    margin: 8px;
    cursor: pointer;
    transition: background-color, 1s;
  }

  .save-button {
    background-color: white;
    color: rgb(10, 102, 194);
    border-color: rgb(10, 102, 194);
    border-style: solid;
    border-width: 0.5px;
    padding-top: 8px;
    padding-bottom: 8px;
    padding-left: 17.5px;
    padding-right: 17.5px;
    border-radius: 2px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
  }

  .apply-button:hover {
    background-color: rgb(10, 91, 172);
  }

  .save-button:hover {
    border-width: 1px;
    background-color: rgb(230, 250, 253);
  }
</style>

<button class="apply-button">Apply on company website</button>

<button class="save-button">Save</button>
