<!doctype html>
<html>
  <head>
    <title>Youtube</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      p {
        font-family: Roboto, Arial;
        margin-top: 0;
        margin-bottom: 0;
      }
      .pic {
        width: 300px;
        display: block;
      }

      .sarch-Bar {
        display: block;
      }
      .video-preview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }

      .channel-pic {
        display: inline-block;
        width: 50px;
        vertical-align: top;
      }

      .video-info {
        display: inline-block;
        width: 200px;
      }

      .profile-pic {
        width: 40px;
        border-radius: 50px;
      }

      .sub-heading {
        margin-top: 0px;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        margin-bottom: 12px;
      }

      .author {
        font-size: 12px;
        color: rgb(96, 96, 96);
        margin-bottom: 4px;
      }

      .stats {
        font-size: 12px;
        color: rgb(96, 96, 96);
      }

      .thumbnail-row {
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <input class="sarch-Bar" type="text" placeholder="Search" />
    <div class="video-preview">
      <div class="thumbnail-row">
        <img class="pic" src="thumbnail-1.webp" />
      </div>
      <div>
        <div class="channel-pic">
          <img class="profile-pic" src="channel-1.jpeg" />
        </div>
        <div class="video-info">
          <p class="sub-heading">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>
          <p class="author">Marques Brownlee</p>
          <p class="stats">3.4M views &#183; 6 months ago</p>
        </div>
      </div>
    </div>

    <div class="video-preview">
      <div class="thumbnail-row">
        <img class="pic" src="thumbnail-2.webp" />
      </div>
      <div>
        <div class="channel-pic">
          <img class="profile-pic" src="channel-2.jpeg" />
        </div>
        <div class="video-info">
          <p class="sub-heading">Try Not To Laugh Challenge #9</p>
          <p class="author">Markiplier</p>
          <p class="stats">19M views &#183; 4 years ago</p>
        </div>
      </div>
    </div>
  </body>
</html>
