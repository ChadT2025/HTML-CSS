<!doctype html>
<head>
  <title>Google</title>
  <style>
    .word {
      font-size: 13px;
      font-family: Arial;
      color: grey;
      margin-bottom: 5px;
    }

    .blank {
      padding-right: 162px;
      padding-top: 8px;
      padding-left: 2px;
      padding-bottom: 8px;
      border-width: 2px;
      border-style: solid;
      border-radius: 3px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .paragraph {
      font-size: 13px;
      font-family: Arial;
      color: grey;
      margin-bottom: 20px;
    }

    .join {
      background-color: rgb(15, 55, 233);
      color: white;
      padding-left: 120px;
      padding-right: 120px;
      padding-top: 15px;
      padding-bottom: 15px;
      font-size: 18px;
      font-family: Arial;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <p class="word">Email</p>
  <input class="blank" src="text" />
  <p class="paragraph">
    By clicking Agree and join, you agree to the Privacy Policy
  </p>
  <button class="join">Join & Agree</button>
</body>
